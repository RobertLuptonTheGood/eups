name: EUPS Build CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

jobs:
  ci:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.15t"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Run CI
      run: |
        ./ci/script.sh

  ci-csh:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
    - name: Install csh
      run: sudo apt install csh
    - name: Run CI
      run: |
        ./ci/script.sh

  ci-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
    - name: Run CI
      run: |
        ./ci/script.sh
